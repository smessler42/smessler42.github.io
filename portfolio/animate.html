<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My First Webpage</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="This is my first website. It includes lots of information about my life.">
        <link rel="icon" type="image/x-icon" href="images/handsock.jpg">

        <style>

            * {
                box-sizing: border-box;
            }

            body {
                border: gray hidden 4px;
                margin: 0;
                font-family: 'Noto Sans', sans-serif;
                background-color: #546B41;
            }

            .container {
                background-color: gainsboro;
            }

            /* ---------- Intro screen ---------- */

            .intro {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                background-color: #546B41;
                color: #FFF8EC;
                padding: 20px;
                position: relative;
                will-change: transform, opacity;
            }

            .intro h1 {
                font-size: clamp(28px, 6vw, 48px);
                margin-bottom: 10px;
            }

            .intro p {
                font-size: clamp(14px, 2.5vw, 18px);
                max-width: 500px;
                opacity: 0.9;
            }

            .downarrow {
                margin-top: 40px;
                animation: bounce 1.6s ease-in-out infinite;
            }

            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(14px); }
            }

            /* ---------- Links screen ---------- */

            .linkscreen {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #FFF8EC;
                padding: 40px 20px;
                overflow: hidden; /* Prevents scrollbars when items/backgrounds are off-screen */
                position: relative; /* Anchor for ambient background element */
            }

            /* Faint background icon element */
            .bg-icon-watermark {
                position: absolute;
                width: 450px;
                height: 450px;
                color: #214341;
                opacity: 0;
                pointer-events: none; /* Mouse ignores it so hover links work seamlessly */
                z-index: 1;
                transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
            }

            /* Starting positions off-screen per direction */
            .bg-icon-watermark[data-dir="up"] {
                top: -50px;
                left: 50%;
                transform: translate(-50%, -100%);
            }
            .bg-icon-watermark[data-dir="down"] {
                bottom: -50px;
                left: 50%;
                transform: translate(-50%, 100%);
            }
            .bg-icon-watermark[data-dir="left"] {
                top: 50%;
                left: -50px;
                transform: translate(-100%, -50%);
            }
            .bg-icon-watermark[data-dir="right"] {
                top: 50%;
                right: -50px;
                transform: translate(100%, -50%);
            }

            /* Active state when hovering a link */
            .bg-icon-watermark.active {
                opacity: 0.07; /* Faint appearance */
            }

            .bg-icon-watermark[data-dir="up"].active {
                transform: translate(-50%, 0);
            }
            .bg-icon-watermark[data-dir="down"].active {
                transform: translate(-50%, 0);
            }
            .bg-icon-watermark[data-dir="left"].active {
                transform: translate(0, -50%);
            }
            .bg-icon-watermark[data-dir="right"].active {
                transform: translate(0, -50%);
            }

            .linkgrid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 60px 80px;
                max-width: 600px;
                width: 100%;
                position: relative;
                z-index: 2; /* Sits above the background watermark */
                will-change: transform, opacity;
            }

            @media (max-width: 600px) {
                .linkgrid {
                    grid-template-columns: 1fr;
                    gap: 40px;
                }
                .bg-icon-watermark {
                    width: 280px;
                    height: 280px;
                }
            }

            .link {
                text-align: center;
                text-decoration: none;
                color: #214341;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                will-change: transform, opacity;
            }

            .link svg {
                width: 64px;
                height: 64px;
                transition: transform 0.3s ease;
            }

            .link h3 {
                margin: 0;
                font-size: 22px;
                letter-spacing: 1px;
            }

            .link:hover {
                color: #546B41;
            }

            .link:hover svg {
                transform: scale(1.15);
            }

            @media (prefers-reduced-motion: reduce) {
                .link, .downarrow, .intro, .linkgrid, .bg-icon-watermark {
                    animation: none !important;
                    transition: none !important;
                    opacity: 1 !important;
                    transform: none !important;
                }
            }

        </style>
    </head>

        <script>
            const intro = document.getElementById('intro');
            const linkscreen = document.getElementById('linkscreen');
            const links = document.querySelectorAll('.link');
            const bgWatermark = document.getElementById('bgWatermark');

            /* ---------- Background Watermark Hover Feature ---------- */
            links.forEach((link) => {
                const svgContent = link.querySelector('svg').innerHTML;
                const dir = link.dataset.dir;

                link.addEventListener('mouseenter', () => {
                    // Copy the SVG icon content and direction to the watermark container
                    bgWatermark.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${svgContent}</svg>`;
                    bgWatermark.setAttribute('data-dir', dir);
                    // Force browser reflow so transition works smoothly when switching directions
                    void bgWatermark.offsetWidth; 
                    bgWatermark.classList.add('active');
                });

                link.addEventListener('mouseleave', () => {
                    bgWatermark.classList.remove('active');
                });
            });


            /* ---------- Parallax Scroll Feature ---------- */
            function handleScroll() {
                const rect = linkscreen.getBoundingClientRect();
                const windowHeight = window.innerHeight;
                const windowWidth = window.innerWidth;

                // Offsets calculated dynamically using window dimensions to guarantee starting off-screen
                const offsets = {
                    up:    { x: 0,                   y: -windowHeight * 0.8 },
                    left:  { x: -windowWidth * 0.8,  y: 0                   },
                    down:  { x: 0,                   y: windowHeight * 0.8  },
                    right: { x: windowWidth * 0.8,   y: 0                   }
                };

                // Calculate scroll progress (0 when section enters screen bottom, 1 when centered)
                let progress = (windowHeight - rect.top) / (windowHeight * 0.85);
                progress = Math.max(0, Math.min(1, progress));

                // 1. Zoom/fade out the Intro screen as you scroll down
                intro.style.opacity = (1 - progress * 1.2).toString();
                intro.style.transform = `scale(${1 - progress * 0.15})`;

                // 2. Fly in each icon from off-screen into its grid position
                links.forEach((link, idx) => {
                    const dir = link.dataset.dir;
                    const offset = offsets[dir];

                    // Slight stagger so icons arrive sequentially
                    const staggerOffset = idx * 0.05;
                    const itemProgress = Math.max(0, Math.min(1, (progress - staggerOffset) / (1 - staggerOffset)));

                    // Interpolate values from off-screen (progress 0) to centered (progress 1)
                    const translateX = (1 - itemProgress) * offset.x;
                    const translateY = (1 - itemProgress) * offset.y;
                    const scale = 0.3 + itemProgress * 0.7; // Zooms up from 30% scale to 100%
                    const opacity = Math.min(1, itemProgress * 2);

                    link.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;
                    link.style.opacity = opacity;
                });
            }

            // Run on scroll using requestAnimationFrame for smooth 60fps performance
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        handleScroll();
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            // Recalculate if viewport resizes
            window.addEventListener('resize', handleScroll);

            // Initial positioning check on load
            handleScroll();
        </script>
